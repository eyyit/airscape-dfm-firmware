name: Firmware checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install native test prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev python3-venv
      - name: Python style checks
        run: |
          python3 -m venv "$RUNNER_TEMP/dfm-lint"
          "$RUNNER_TEMP/dfm-lint/bin/pip" install ruff==0.14.0
          "$RUNNER_TEMP/dfm-lint/bin/ruff" format --check tools tests
          "$RUNNER_TEMP/dfm-lint/bin/ruff" check tools tests
      - name: Check repository privacy
        run: python3 tools/check_public.py
      - name: Verify license inventory
        run: python3 tools/check_licenses.py
      - name: Scan Git history for secrets
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner
      - name: Pull locked SDK
        run: docker pull "$(python3 -c 'import json;print(json.load(open("tools/build-env.json"))["image"])')"
      - name: Unit, integration and coverage checks
        run: ./tools/test-all.sh
      - name: Build and compare clean outputs
        run: ./tools/check-reproducible.sh
      - name: Check compiled public artifacts
        run: python3 tools/check_public.py --build build_a
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-reports
          path: |
            artifacts/build-manifest.json
            artifacts/coverage/summary.json
          if-no-files-found: error
